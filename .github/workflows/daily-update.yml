name: Daily Research Log

on:
  schedule:
    - cron: '17 12 * * *'   # todos los días ~09:17 Paraguay
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update research log
        run: |
          echo "- $(date -u '+%Y-%m-%d') | Daily research activity" >> activity.md

      - name: Commit and push
        run: |
          git config user.name "DanyBo99"
          git config user.email "318012697+DanyBo99@users.noreply.github.com."
          git add activity.md
          git commit -m "chore: daily research update"
          git push
